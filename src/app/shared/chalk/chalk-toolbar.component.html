<mc-confirm-dialog
  [request]="confirm.request()"
  (confirmed)="confirm.accept()"
  (cancelled)="confirm.cancel()"
/>
<div class="bar" data-tutorial="lists-chalk-bar" [class.active]="active()">
  <button
    type="button"
    class="mode"
    [class.on]="active()"
    [attr.aria-pressed]="active()"
    [attr.aria-label]="t('chalk.toggleAria')"
    [title]="t('chalk.toggle')"
    (click)="toggleActive.emit()"
  >
    <mc-icon name="note-pencil" />
    <span>{{ active() ? t('chalk.on') : t('chalk.off') }}</span>
  </button>

  @if (active()) {
    <div class="group" role="radiogroup" [attr.aria-label]="t('chalk.toolAria')">
      <button
        type="button"
        class="tool"
        role="radio"
        data-tutorial="lists-chalk-tool-chalk"
        [attr.aria-checked]="tool() === 'chalk'"
        [class.sel]="tool() === 'chalk'"
        [title]="t('chalk.tool.chalk')"
        (click)="toolChange.emit('chalk')"
      >
        <mc-icon name="paint-brush" />
      </button>
      <button
        type="button"
        class="tool"
        role="radio"
        data-tutorial="lists-chalk-tool-eraser"
        [attr.aria-checked]="tool() === 'eraser'"
        [class.sel]="tool() === 'eraser'"
        [title]="t('chalk.tool.eraser')"
        (click)="toolChange.emit('eraser')"
      >
        <mc-icon name="x" />
      </button>
    </div>

    <div
      class="group palette"
      data-tutorial="lists-chalk-palette"
      role="radiogroup"
      [attr.aria-label]="t('chalk.colorAria')"
    >
      @for (c of palette; track c.id) {
        <button
          type="button"
          class="chalk chalk-{{ c.id }}"
          role="radio"
          [attr.aria-checked]="color() === c.id"
          [class.sel]="color() === c.id"
          [title]="colorLabel(c.id)"
          [attr.aria-label]="colorLabel(c.id)"
          (click)="colorChange.emit(c.id)"
        ></button>
      }
    </div>

    <div
      class="group sizes"
      data-tutorial="lists-chalk-sizes"
      role="radiogroup"
      [attr.aria-label]="t('chalk.sizeAria')"
    >
      @for (s of sizes; track s) {
        <button
          type="button"
          class="size size-{{ s }}"
          role="radio"
          [attr.aria-checked]="size() === s"
          [class.sel]="size() === s"
          [title]="sizeLabel(s)"
          [attr.aria-label]="sizeLabel(s)"
          (click)="sizeChange.emit(s)"
        >
          <span class="dot"></span>
        </button>
      }
    </div>

    <div class="group history">
      <button
        type="button"
        class="tool"
        data-tutorial="lists-chalk-undo"
        [disabled]="!canUndo()"
        [attr.aria-label]="t('chalk.undoAria')"
        [title]="t('chalk.undo')"
        (click)="undo.emit()"
      >
        <mc-icon name="arrow-counter-clockwise" />
      </button>
      <button
        type="button"
        class="tool mirror"
        data-tutorial="lists-chalk-redo"
        [disabled]="!canRedo()"
        [attr.aria-label]="t('chalk.redoAria')"
        [title]="t('chalk.redo')"
        (click)="redo.emit()"
      >
        <mc-icon name="arrow-counter-clockwise" />
      </button>
    </div>

    <button
      type="button"
      class="ghost"
      data-tutorial="lists-chalk-clear"
      [disabled]="!canClear()"
      [title]="t('chalk.clear')"
      (click)="onClear()"
    >
      <mc-icon name="trash" />
      <span>{{ t('chalk.clear') }}</span>
    </button>

    <button
      type="button"
      class="ghost"
      data-tutorial="lists-chalk-layers-toggle"
      [class.on]="layersOpen()"
      [attr.aria-pressed]="layersOpen()"
      [title]="t('chalk.layers')"
      (click)="toggleLayers.emit()"
    >
      <mc-icon name="list-bullets" />
      <span>{{ t('chalk.layers') }}</span>
      @if (layerCount() > 0) {
        <span class="count-badge">{{ layerCount() }}</span>
      }
    </button>

    <mc-menu-button
      variant="ghost"
      data-tutorial="lists-chalk-export"
      [label]="t('chalk.export')"
      [options]="exportOptions"
      (choose)="onExportChoice($event)"
    />
  }
</div>
