<mc-confirm-dialog
  [request]="confirm.request()"
  (confirmed)="confirm.accept()"
  (cancelled)="confirm.cancel()"
/>
<aside class="panel" data-tutorial="lists-chalk-layers-panel">
  <header>
    <h3>{{ t('chalk.layers') }}</h3>
    <button
      type="button"
      class="icon"
      [attr.aria-label]="t('common.close')"
      [title]="t('common.close')"
      (click)="closeRequested.emit()"
    >
      <mc-icon name="x" />
    </button>
  </header>
  <p class="hint">{{ t('chalk.layersHint') }}</p>

  <button
    type="button"
    class="add"
    data-tutorial="lists-chalk-layers-add"
    (click)="addLayer.emit()"
  >
    <mc-icon name="plus" />
    <span>{{ t('chalk.addLayer') }}</span>
  </button>

  @if (layers().length === 0) {
    <p class="empty">{{ t('chalk.layersEmpty') }}</p>
  }

  <ul class="rows">
    @for (layer of layers(); track layer.id; let i = $index) {
      <li
        class="row"
        [class.active]="activeId() === layer.id"
        [class.row--dragging]="dnd.draggingId() === layer.id"
        [class.row--over]="dnd.overZone() === layer.id && dnd.draggingId() !== layer.id"
        (dragover)="dnd.onDragOver($event)"
        (dragenter)="dnd.onDragEnter(layer.id)"
        (dragleave)="dnd.onDragLeave(layer.id)"
        (drop)="onLayerDrop(layer.id)"
      >
        <div class="row-main">
          <button
            type="button"
            class="select"
            draggable="true"
            [attr.aria-pressed]="activeId() === layer.id"
            [title]="t('chalk.selectLayer')"
            (click)="selectLayer.emit(layer.id)"
            (dragstart)="dnd.onDragStart($event, layer.id)"
            (dragend)="dnd.onDragEnd()"
          >
            <span
              class="dot"
              [class.on]="activeId() === layer.id"
              [style.--dot-color]="swatchHex(layer)"
            ></span>
          </button>
          <input
            type="text"
            class="name"
            data-tutorial="lists-chalk-layer-rename"
            [value]="layer.name"
            [attr.aria-label]="t('chalk.layerName')"
            (input)="onRenameInput(layer.id, $event)"
          />
          <span class="count" [class.count--empty]="layer.strokes.length === 0">{{
            strokeLabel(layer)
          }}</span>
        </div>
        <div class="row-actions">
          <button
            type="button"
            class="icon"
            data-tutorial="lists-chalk-layer-visibility"
            [attr.aria-label]="layer.visible ? t('chalk.hide') : t('chalk.show')"
            [title]="layer.visible ? t('chalk.hide') : t('chalk.show')"
            (click)="toggleVisible.emit(layer.id)"
          >
            <mc-icon [name]="layer.visible ? 'eye' : 'eye-slash'" />
          </button>
          <button
            type="button"
            class="icon"
            data-tutorial="lists-chalk-layer-lock"
            [attr.aria-label]="layer.locked ? t('chalk.unlock') : t('chalk.lock')"
            [title]="layer.locked ? t('chalk.unlock') : t('chalk.lock')"
            (click)="toggleLocked.emit(layer.id)"
          >
            <mc-icon [name]="layer.locked ? 'lock' : 'lock-open'" />
          </button>
          <span class="sep" aria-hidden="true"></span>
          <button
            type="button"
            class="icon"
            data-tutorial="lists-chalk-layer-reorder"
            [disabled]="i === 0"
            [attr.aria-label]="t('chalk.moveUp')"
            [title]="t('chalk.moveUp')"
            (click)="moveLayer.emit({ id: layer.id, direction: -1 })"
          >
            <mc-icon name="arrow-up" />
          </button>
          <button
            type="button"
            class="icon"
            [disabled]="i === layers().length - 1"
            [attr.aria-label]="t('chalk.moveDown')"
            [title]="t('chalk.moveDown')"
            (click)="moveLayer.emit({ id: layer.id, direction: 1 })"
          >
            <mc-icon name="arrow-down" />
          </button>
          <span class="sep" aria-hidden="true"></span>
          <button
            type="button"
            class="icon danger"
            data-tutorial="lists-chalk-layer-remove"
            [attr.aria-label]="t('chalk.removeLayer')"
            [title]="t('chalk.removeLayer')"
            (click)="onRemove(layer)"
          >
            <mc-icon name="trash" />
          </button>
        </div>
      </li>
    }
  </ul>
</aside>
