@if (isReady()) {
  <header class="bar">
    <h2 class="title">mi-cerebro</h2>
    <div class="newgroup">
      <button type="button" class="primary" (click)="createNote()">+ {{ t('notes.new') }}</button>
      <button type="button" class="primary" (click)="createTask()">+ {{ t('tasks.new') }}</button>
      <button type="button" class="primary" (click)="createGoal()">+ {{ t('goals.new') }}</button>
      <button type="button" class="primary" (click)="createList()">+ {{ t('lists.new') }}</button>
      <button type="button" class="primary" (click)="createWriting()">
        + {{ t('writings.new') }}
      </button>
      <button type="button" class="primary" (click)="createBook()">+ {{ t('books.new') }}</button>
    </div>
    <div class="newgroup">
      <button type="button" class="ghost" (click)="createFolder('note')">
        + {{ t('folders.newIn').replace('{kind}', t('tree.type.notes')) }}
      </button>
      <button type="button" class="ghost" (click)="createFolder('task')">
        + {{ t('folders.newIn').replace('{kind}', t('tree.type.tasks')) }}
      </button>
      <button type="button" class="ghost" (click)="createFolder('goal')">
        + {{ t('folders.newIn').replace('{kind}', t('tree.type.goals')) }}
      </button>
      <button type="button" class="ghost" (click)="createFolder('list')">
        + {{ t('folders.newIn').replace('{kind}', t('tree.type.lists')) }}
      </button>
      <button type="button" class="ghost" (click)="createFolder('writing')">
        + {{ t('folders.newIn').replace('{kind}', t('tree.type.writings')) }}
      </button>
      <button type="button" class="ghost" (click)="createFolder('book')">
        + {{ t('folders.newIn').replace('{kind}', t('tree.type.books')) }}
      </button>
    </div>
  </header>
  <nav class="chips" role="tablist" [attr.aria-label]="t('tree.type.all')">
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="typeFilter() === 'all'"
      [class.active]="typeFilter() === 'all'"
      (click)="setType('all')"
    >
      {{ t('tree.type.all') }}
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="typeFilter() === 'notes'"
      [class.active]="typeFilter() === 'notes'"
      (click)="setType('notes')"
    >
      {{ t('tree.type.notes') }}
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="typeFilter() === 'tasks'"
      [class.active]="typeFilter() === 'tasks'"
      (click)="setType('tasks')"
    >
      {{ t('tree.type.tasks') }}
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="typeFilter() === 'goals'"
      [class.active]="typeFilter() === 'goals'"
      (click)="setType('goals')"
    >
      {{ t('tree.type.goals') }}
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="typeFilter() === 'lists'"
      [class.active]="typeFilter() === 'lists'"
      (click)="setType('lists')"
    >
      {{ t('tree.type.lists') }}
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="typeFilter() === 'writings'"
      [class.active]="typeFilter() === 'writings'"
      (click)="setType('writings')"
    >
      {{ t('tree.type.writings') }}
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="typeFilter() === 'books'"
      [class.active]="typeFilter() === 'books'"
      (click)="setType('books')"
    >
      {{ t('tree.type.books') }}
    </button>
  </nav>
  <mc-tree-filter
    [query]="query()"
    [direction]="direction()"
    [matchCount]="result().matches.length"
    (queryChange)="onQuery($event)"
    (directionChange)="onDirection($event)"
    (next)="onNext()"
    (prev)="onPrev()"
    (activateFirst)="onActivateFirst()"
    (clear)="onClear()"
  />
  <mc-tree
    [nodes]="treeRoots()"
    [visible]="result().visible"
    [matchedIds]="matchedIds()"
    [autoExpand]="result().autoExpand"
    [selectedId]="selectedNodeId()"
    [emptyKey]="emptyKey()"
    (chooseNode)="choose($event)"
    (nodeAction)="onNodeAction($event)"
  />
  <footer class="footer">
    <button type="button" class="trash-link" [class.active]="isTrashRoute()" (click)="goToTrash()">
      {{ t('trash.title') }}
    </button>
  </footer>
}
