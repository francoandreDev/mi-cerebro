@if (isReady()) {
  <header class="bar">
    <div class="title-row">
      <h2 class="title">mi-cerebro</h2>
      <button
        type="button"
        class="search-btn"
        [attr.aria-label]="t('palette.openButton')"
        [title]="t('palette.openButton')"
        (click)="openPalette()"
      >
        🔍
      </button>
    </div>
    <div class="actions">
      <mc-menu-button
        variant="primary"
        [label]="'+ ' + t('common.new')"
        [options]="newOptions()"
        (choose)="onCreateEntity($event)"
      />
      <mc-menu-button
        variant="ghost"
        [label]="'+ ' + t('common.folder')"
        [options]="folderOptions()"
        (choose)="onCreateFolderFor($event)"
      />
    </div>
  </header>
  <mc-tree-filter
    [query]="query()"
    [direction]="direction()"
    [matchCount]="result().matches.length"
    (queryChange)="onQuery($event)"
    (directionChange)="onDirection($event)"
    (next)="onNext()"
    (prev)="onPrev()"
    (activateFirst)="onActivateFirst()"
    (clear)="onClear()"
  />
  <mc-tree
    [nodes]="treeRoots()"
    [visible]="result().visible"
    [matchedIds]="matchedIds()"
    [autoExpand]="result().autoExpand"
    [selectedId]="selectedNodeId()"
    [emptyKey]="emptyKey()"
    (chooseNode)="choose($event)"
    (nodeAction)="onNodeAction($event)"
  />
  <footer class="footer">
    <button type="button" class="trash-link" [class.active]="isTrashRoute()" (click)="goToTrash()">
      {{ t('trash.title') }}
    </button>
  </footer>
}
