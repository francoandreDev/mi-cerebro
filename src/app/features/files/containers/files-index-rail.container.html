<header class="head">
  <h2 class="title">{{ t('files.title') }}</h2>
  <button
    type="button"
    class="search-btn"
    [attr.aria-label]="t('palette.openButton')"
    [title]="t('palette.openButton')"
    (click)="openPalette()"
  >
    <mc-icon name="magnifying-glass" />
  </button>
</header>
<div class="actions">
  <button type="button" class="primary" (click)="onCreateCollection()">
    + {{ t('files.new') }}
  </button>
  <button type="button" class="ghost" (click)="onCreateFolder()">+ {{ t('common.folder') }}</button>
</div>
<mc-tree-filter
  [query]="query()"
  [direction]="direction()"
  [matchCount]="result().matches.length"
  [placeholder]="filterPlaceholder()"
  [matches]="filterMatches()"
  [activeMatchId]="activeMatchId()"
  (queryChange)="onQuery($event)"
  (directionChange)="onDirection($event)"
  (next)="onNext()"
  (prev)="onPrev()"
  (activateFirst)="onActivateFirst()"
  (clear)="onClear()"
  (chooseMatch)="onChooseMatch($event)"
/>
<mc-tree
  [nodes]="treeRoots()"
  [visible]="result().visible"
  [matchedIds]="matchedIds()"
  [activeMatchId]="activeMatchId()"
  [autoExpand]="result().autoExpand"
  [selectedId]="selectedNodeId()"
  [emptyKey]="emptyKey()"
  [rootParentId]="treeRootParentId"
  [announcement]="reorderAnnouncement()"
  (chooseNode)="choose($event)"
  (nodeAction)="onNodeAction($event)"
  (reorder)="onReorder($event)"
/>
