<mc-confirm-dialog
  [request]="confirm.request()"
  (confirmed)="confirm.accept()"
  (cancelled)="confirm.cancel()"
/>
<mc-folder-action-dialog
  [state]="folderActionDialog.state()"
  (chooseRename)="folderActionDialog.chooseRename()"
  (chooseMove)="folderActionDialog.chooseMove()"
  (chooseDelete)="folderActionDialog.chooseDelete()"
  (textSubmitted)="folderActionDialog.submitText($event)"
  (confirmDelete)="folderActionDialog.confirmDelete()"
  (cancelled)="folderActionDialog.cancel()"
/>
<section class="board">
  <header class="board-head">
    <h1 class="board-title">
      <mc-icon name="list-bullets" class="title-icon" aria-hidden="true" />
      {{ t('lists.title') }}
    </h1>
    <div class="search" data-tutorial="lists-shelf-search">
      <mc-icon name="magnifying-glass" class="search-icon" aria-hidden="true" />
      <input
        type="search"
        class="search-input"
        [value]="query()"
        [attr.aria-label]="t('lists.board.searchAria')"
        [placeholder]="t('lists.board.searchPlaceholder')"
        (input)="onQueryInput($event)"
      />
      @if (query()) {
        <button
          type="button"
          class="search-clear"
          [attr.aria-label]="t('lists.board.searchClear')"
          (click)="onClearQuery()"
        >
          <mc-icon name="x" />
        </button>
      }
    </div>
  </header>

  <mc-folder-breadcrumb
    [currentPath]="currentFolder()"
    [allFolders]="allFolders()"
    (navigate)="onFolderNavigate($event)"
    (createSubfolder)="onCreateSubfolder()"
    (manageFolder)="onManageFolder($event)"
  />

  @if (empty()) {
    <div class="board-body solo">
      <mc-chalk-new-entry
        data-tutorial="lists-shelf-new"
        [busy]="creating()"
        [hero]="true"
        (create)="onCreate($event)"
      />
    </div>
  } @else {
    <div class="board-body">
      <mc-chalk-rail
        data-tutorial="lists-shelf-rail"
        [axis]="axis()"
        [groups]="railGroups()"
        [activeKey]="activeKey()"
        (axisChange)="onAxisChange($event)"
        (jump)="onJump($event)"
      />
      <div #flow class="flow" (scroll)="onScroll($event)">
        @for (section of sections(); track section.key) {
          <section class="section">
            <h2 class="section-head" [attr.data-section-key]="section.key">
              @if (section.color) {
                <span
                  class="section-dot"
                  [style.background]="section.color"
                  aria-hidden="true"
                ></span>
              }
              <span>{{ section.label }}</span>
            </h2>
            <div class="section-flow">
              @for (list of section.lists; track list.id) {
                <mc-chalk-entry
                  [list]="list"
                  [availableTags]="tags()"
                  [untitledLabel]="untitledLabel()"
                  [query]="query()"
                  (open)="onOpen(list.id, list.title)"
                  (remove)="onDelete($event)"
                />
              }
            </div>
          </section>
        }
        <mc-chalk-new-entry
          data-tutorial="lists-shelf-new"
          [busy]="creating()"
          (create)="onCreate($event)"
        />
        @if (hasQuery() && !anyMatch()) {
          <p class="no-match">{{ t('lists.board.noMatch') }}</p>
        }
      </div>
    </div>
  }
</section>
