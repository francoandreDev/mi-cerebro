<mc-folder-action-dialog
  [state]="folderActionDialog.state()"
  (chooseRename)="folderActionDialog.chooseRename()"
  (chooseMove)="folderActionDialog.chooseMove()"
  (chooseDelete)="folderActionDialog.chooseDelete()"
  (textSubmitted)="folderActionDialog.submitText($event)"
  (confirmDelete)="folderActionDialog.confirmDelete()"
  (cancelled)="folderActionDialog.cancel()"
/>

<header class="header">
  <h1><mc-icon name="image-square" class="title-icon" /> {{ t('images.title') }}</h1>
  <div class="ops">
    <div class="search-wrap">
      <mc-icon name="magnifying-glass" class="search-icon" />
      <input
        type="search"
        class="filter"
        [placeholder]="t('images.index.search')"
        [attr.aria-label]="t('images.index.search')"
        [value]="query()"
        (input)="onQuery($event)"
      />
    </div>
    <select
      class="select"
      [attr.aria-label]="t('images.index.sort.label')"
      [value]="sortKey()"
      (change)="onSort($event)"
    >
      <option value="recent">{{ t('images.index.sort.recent') }}</option>
      <option value="title">{{ t('images.index.sort.title') }}</option>
    </select>
    @if (tags().length > 0) {
      <select
        class="select"
        [attr.aria-label]="t('images.index.tagFilter.label')"
        [value]="tagFilter()"
        (change)="onTagFilter($event)"
      >
        <option value="">{{ t('images.index.tagFilter.all') }}</option>
        @for (tag of tags(); track tag.id) {
          <option [value]="tag.id">{{ tag.label }}</option>
        }
      </select>
    }
    <button
      type="button"
      class="primary mc-hover-grow"
      data-tutorial="images-new"
      (click)="createGallery()"
    >
      <mc-icon name="plus" />
      <span>{{ t('images.new') }}</span>
    </button>
  </div>
</header>

<mc-folder-breadcrumb
  [currentPath]="currentFolder()"
  [allFolders]="allFolders()"
  (navigate)="onFolderNavigate($event)"
  (createSubfolder)="onCreateSubfolder()"
  (manageFolder)="onManageFolder($event)"
/>

@if (summaries().length === 0) {
  <div class="empty">
    <mc-icon name="image-square" class="empty-icon mc-anim-float" />
    <p>{{ t('images.empty') }}</p>
    <button type="button" class="primary mc-hover-grow" (click)="createGallery()">
      <mc-icon name="plus" />
      <span>{{ t('images.new') }}</span>
    </button>
  </div>
} @else if (cells().length === 0) {
  <p class="empty-soft">
    <mc-icon name="magnifying-glass" class="empty-icon-soft mc-anim-pulse" />
    {{ t('images.index.noMatch') }}
  </p>
} @else {
  <section class="planta" [attr.aria-label]="t('images.museum.planLabel')">
    <div class="planta-grid">
      @for (cell of cells(); track cell.summary.id) {
        <button
          type="button"
          class="plant-cell"
          [class.active]="cell.active"
          [style.background]="cell.bg"
          [style.color]="cell.fg"
          [attr.aria-label]="cell.title"
          [attr.aria-current]="cell.active ? 'true' : null"
          (click)="onSelectCell(cell.summary.id)"
          (dblclick)="openGallery(cell.summary.id, cell.summary.title)"
        >
          <span class="plant-title">{{ cell.title }}</span>
          <span class="plant-sub">{{ cell.subtitle }}</span>
        </button>
      }
    </div>
  </section>

  @if (activeCell(); as active) {
    <section class="sala-wrap">
      <header class="sala-head">
        <span class="sala-name">{{ active.title }}</span>
        <button type="button" class="walk" (click)="onOpenActive()">
          <span>{{ t('images.museum.walk') }}</span>
          <mc-icon name="arrow-right" />
        </button>
      </header>
      <mc-museum-room
        [images]="previewImages()"
        [urls]="previewUrls()"
        [cuartoIndex]="0"
        [cuartos]="1"
        [editable]="false"
        mode="preview"
        (open)="onPreviewOpen($event)"
      />
    </section>
  }
}
