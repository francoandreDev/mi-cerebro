<mc-confirm-dialog
  [request]="confirm.request()"
  (confirmed)="confirm.accept()"
  (cancelled)="confirm.cancel()"
/>
<div class="pane">
  @if (active(); as gallery) {
    @if (lock.showForeign()) {
      <mc-lock-banner
        kind="foreign"
        [title]="t('images.lock.foreign.title')"
        [message]="t('images.lock.foreign.message')"
        [readonlyLabel]="t('images.lock.foreign.readonly')"
        [takeoverLabel]="t('images.lock.foreign.takeover')"
        (readonly)="lock.acceptReadonly()"
        (takeover)="lock.takeover()"
      />
    } @else if (lock.showEvicted()) {
      <mc-lock-banner
        kind="evicted"
        [title]="t('images.lock.evicted.title')"
        [message]="t('images.lock.evicted.message')"
        [dismissLabel]="t('images.lock.evicted.dismiss')"
        (dismiss)="lock.dismissEvicted()"
      />
    }
    <mc-gallery-meta-bar
      [gallery]="gallery"
      [status]="status()"
      [availableTags]="tags()"
      [editable]="lock.editable()"
      (titleChange)="onTitleChange($event)"
      (removeGallery)="onDeleteGallery()"
      (addTag)="onAddTag($event)"
      (removeTag)="onRemoveTag($event)"
    />
    <mc-connections-panel [entityKind]="entityKind" [entityId]="gallery.id" />
    <mc-museum-room
      data-tutorial="images-room"
      [images]="currentCuarto()"
      [urls]="thumbUrls()"
      [cuartoIndex]="cuartoIndex()"
      [cuartos]="cuartosCount()"
      [editable]="lock.editable()"
      mode="full"
      (open)="onOpenImage($event)"
      (remove)="onRemoveImage($event)"
      (addFiles)="onAddFiles($event)"
      (nextCuarto)="onNextCuarto()"
      (prevCuarto)="onPrevCuarto()"
    />
    <mc-room-minimap
      data-tutorial="images-room-minimap"
      [cuartoSizes]="cuartoSizes()"
      [cuartoIndex]="cuartoIndex()"
      (jump)="onJumpCuarto($event)"
    />
    @if (openImage(); as img) {
      <mc-image-lightbox
        [image]="img"
        [url]="originalUrls()[img.id] ?? ''"
        (dismiss)="onCloseLightbox()"
      />
    }
  } @else {
    <div class="empty">
      <mc-icon name="image-square" class="empty-icon mc-anim-float" />
      <span>{{ t('images.selectOne') }}</span>
    </div>
  }
</div>
