<div class="top">
  <a routerLink="/images" class="back mc-hover-grow" [title]="t('images.breadcrumb.root')">
    <mc-icon name="caret-left" />
    <span>{{ t('images.breadcrumb.root') }}</span>
  </a>
  <span class="spacer"></span>
  <span
    class="status"
    [attr.data-status]="status()"
    [attr.aria-label]="statusLabel()"
    [title]="statusLabel()"
  >
    <mc-icon
      [name]="statusIcon()"
      [class.mc-anim-spin]="status() === 'saving'"
      [class.mc-anim-pulse]="status() === 'unsaved'"
    />
  </span>
  @if (editable()) {
    <mc-menu-button
      data-tutorial="images-gallery-menu"
      variant="ghost"
      [label]="'⋯'"
      [options]="menuOptions()"
      (choose)="onMenuChoose($event)"
    />
  }
</div>
<div class="title-row">
  <mc-icon name="image-square" class="title-icon" />
  <input
    type="text"
    class="title-input"
    [value]="gallery().title"
    [placeholder]="t('images.placeholderTitle')"
    [attr.aria-label]="t('images.placeholderTitle')"
    [readOnly]="!editable()"
    (input)="onTitleInput($event)"
  />
</div>
<div class="bottom">
  <mc-tag-picker
    class="tags"
    [availableTags]="availableTags()"
    [selectedIds]="gallery().tags"
    [editable]="editable()"
    (addTag)="addTag.emit($event)"
    (removeTag)="removeTag.emit($event)"
  />
</div>
