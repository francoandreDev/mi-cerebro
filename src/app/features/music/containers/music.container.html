<section class="page">
  <div class="zones">
    <!-- LEFT: biblioteca de álbumes / playlists (segmented toggle). -->
    <aside class="zone zone-left" [attr.aria-label]="t('music.library')">
      <div class="zone-left-tabs" role="tablist" [attr.aria-label]="t('music.tabs.aria')">
        <button
          type="button"
          role="tab"
          data-tutorial="music-tab-albums"
          [attr.aria-selected]="leftView() === 'albums'"
          [class.is-active]="leftView() === 'albums'"
          class="tab mc-hover-grow"
          (click)="onSelectLeftView('albums')"
        >
          <mc-icon name="music-note" />
          <span>{{ t('music.tabs.albums') }}</span>
        </button>
        <button
          type="button"
          role="tab"
          data-tutorial="music-tab-playlists"
          [attr.aria-selected]="leftView() === 'playlists'"
          [class.is-active]="leftView() === 'playlists'"
          class="tab mc-hover-grow"
          (click)="onSelectLeftView('playlists')"
          (dragover)="onPlaylistsTabDragOver($event)"
          (dragleave)="onPlaylistsTabDragLeave()"
        >
          <mc-icon name="list-bullets" />
          <span>{{ t('music.tabs.playlists') }}</span>
          <span class="tab-count">{{ playlistSummaries().length }}</span>
        </button>
      </div>

      @if (leftView() === 'albums') {
        <mc-album-library
          [playlistSummaries]="playlistSummaries()"
          (tracksTouched)="onTracksTouched($event)"
        />
      } @else {
        <mc-playlists-panel (selected)="onSelectPlaylistFromPanel($event)" />
      }
    </aside>

    <!-- CENTER: superficie resonante (top) + waveform/metadata (bottom). Editor toma todo cuando hay playlist activa. -->
    <section class="zone zone-center">
      @if (active(); as playlist) {
        <mc-playlist-editor
          [playlist]="playlist"
          (back)="onEditorBack()"
          (changed)="onEditorChanged($event)"
          (deleted)="onEditorDeleted()"
        />
      } @else {
        <div
          class="center-top"
          data-tutorial="music-surface"
          role="region"
          aria-label="Superficie resonante"
        >
          <mc-resonant-surface />
        </div>
        <div class="center-bottom" role="region" aria-label="Now playing">
          <mc-now-playing />
        </div>
      }
    </section>

    <!-- RIGHT: cola -->
    <aside class="zone zone-right" aria-label="Cola">
      <mc-queue-panel />
    </aside>
  </div>
</section>
