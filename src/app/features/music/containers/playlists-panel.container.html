<header class="zone-head">
  <h3>
    <mc-icon name="list-bullets" class="zone-head-icon" />
    {{ t('music.playlists') }} ({{ summaries().length }})
  </h3>
  <button
    type="button"
    class="primary mc-hover-grow"
    data-tutorial="music-playlists-create"
    (click)="onCreate()"
  >
    <mc-icon name="plus" />
    <span>{{ t('music.newPlaylist') }}</span>
  </button>
</header>

@if (summaries().length === 0) {
  <div class="empty">
    <mc-icon name="star" class="empty-icon mc-anim-float" />
    <span>{{ t('music.modal.playlists.empty') }}</span>
    <button type="button" class="primary mc-hover-grow" (click)="onCreate()">
      <mc-icon name="plus" />
      <span>{{ t('music.newPlaylist') }}</span>
    </button>
  </div>
} @else {
  <ul class="pl-list">
    @for (p of summaries(); track p.id) {
      <li>
        <button
          type="button"
          data-tutorial="music-playlists-row"
          [class.now-playing]="currentSourceId() === p.id"
          [class.drag-over]="dragOverId() === p.id"
          (click)="onSelect(p)"
          (dragover)="onRowDragOver(p.id, $event)"
          (dragleave)="onRowDragLeave(p.id)"
          (drop)="onRowDrop(p.id, $event)"
        >
          <span class="pl-title">
            @if (currentSourceId() === p.id) {
              <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
            } @else if (p.favorite) {
              <mc-icon name="star-fill" />
            }
            <span class="pl-name">{{ p.title || t('music.untitledPlaylist') }}</span>
          </span>
          <span class="count">{{ p.trackCount }}</span>
        </button>
      </li>
    }
  </ul>
}
