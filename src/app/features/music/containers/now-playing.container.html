<header class="zone-head">
  <h3>{{ t('music.title') }}</h3>
</header>
@if (currentTrack(); as np) {
  <div class="np-card">
    <div class="np-art" aria-hidden="true">
      <mc-icon name="music-notes" />
    </div>
    <p class="np-title">{{ np.originalName }}</p>
    @if (sourceTitle(); as src) {
      <p class="np-source">{{ src }}</p>
    }
    <div class="np-seek">
      <span class="np-time">{{ formatTime(currentTime()) }}</span>
      <input
        type="range"
        class="np-seek-input"
        min="0"
        [max]="duration() || 0"
        step="0.5"
        [value]="currentTime()"
        (input)="onSeek(asInput($event.target).valueAsNumber)"
        [attr.aria-label]="t('music.seek')"
      />
      <span class="np-time">{{ formatTime(duration()) }}</span>
    </div>
    <div class="np-controls">
      <button
        type="button"
        class="icon-btn"
        [class.fav-active]="shuffle()"
        (click)="onToggleShuffle()"
        [title]="t('music.shuffle')"
        [attr.aria-label]="t('music.shuffle')"
        [attr.aria-pressed]="shuffle()"
      >
        <mc-icon name="shuffle" />
      </button>
      <button
        type="button"
        class="icon-btn"
        (click)="onPrev()"
        [title]="t('music.prev')"
        [attr.aria-label]="t('music.prev')"
      >
        <mc-icon name="skip-back" />
      </button>
      <button
        type="button"
        class="icon-btn np-skip"
        (click)="onSkip(-10)"
        [title]="t('music.skipBack10')"
        [attr.aria-label]="t('music.skipBack10')"
      >
        −10s
      </button>
      <button
        type="button"
        class="icon-btn np-toggle"
        (click)="onTogglePlay()"
        [title]="t('music.playPause')"
        [attr.aria-label]="t('music.playPause')"
      >
        @if (isPlaying()) {
          <mc-icon name="pause" />
        } @else {
          <mc-icon name="play" />
        }
      </button>
      <button
        type="button"
        class="icon-btn np-skip"
        (click)="onSkip(10)"
        [title]="t('music.skipForward10')"
        [attr.aria-label]="t('music.skipForward10')"
      >
        +10s
      </button>
      <button
        type="button"
        class="icon-btn"
        (click)="onNext()"
        [title]="t('music.next')"
        [attr.aria-label]="t('music.next')"
      >
        <mc-icon name="skip-forward" />
      </button>
      <button
        type="button"
        class="icon-btn"
        [class.fav-active]="repeat() === 'all'"
        (click)="onToggleRepeat()"
        [title]="t('music.repeat')"
        [attr.aria-label]="t('music.repeat')"
        [attr.aria-pressed]="repeat() === 'all'"
      >
        <mc-icon name="arrows-clockwise" />
      </button>
      <button
        type="button"
        class="icon-btn"
        (click)="onStop()"
        [title]="t('music.stop')"
        [attr.aria-label]="t('music.stop')"
      >
        ✕
      </button>
    </div>
  </div>
} @else {
  <p class="empty">{{ t('music.sidebar.emptyTopTracks') }}</p>
}
