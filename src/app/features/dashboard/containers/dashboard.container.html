<div class="dashboard">
  <header class="page-header">
    <h1>{{ t('dashboard.title') }}</h1>
    <p>{{ t('dashboard.subtitle') }}</p>
  </header>
  <div class="grid">
    <mc-dashboard-tasks-widget
      [tasks]="todayTasks()"
      [availableTags]="availableTags()"
      (open)="onOpenTask($event)"
    />
    <mc-dashboard-goals-widget
      [goals]="activeGoals()"
      [availableTags]="availableTags()"
      (open)="onOpenGoal($event)"
    />
    <mc-dashboard-reminders-widget
      [reminders]="upcomingReminders()"
      (viewAll)="onViewAllReminders()"
    />
    <mc-dashboard-recent-widget
      [entries]="recentEntries()"
      [availableTags]="availableTags()"
      (open)="onOpenEntry($event)"
    />
    <mc-dashboard-resurface-widget
      [entries]="resurfaceEntries()"
      [availableTags]="availableTags()"
      (open)="onOpenEntry($event)"
      (shuffle)="onShuffleResurface()"
    />
  </div>
</div>
