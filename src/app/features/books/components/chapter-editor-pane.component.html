<div class="book-frame" [class.focus-mode]="focusMode()">
  <button
    type="button"
    class="page-nav prev"
    [disabled]="currentSpread() === 0"
    [attr.aria-label]="t('books.editor.pageTurnPrev')"
    [title]="t('books.editor.pageTurnPrev') + ' · PgUp'"
    (click)="prevSpread()"
  >
    ‹
  </button>

  <div class="book">
    <header class="ui-bar">
      <span class="spacer"></span>
      <span class="status" [attr.data-status]="status()">{{ statusLabel() }}</span>
      <button
        type="button"
        class="focus-toggle"
        [class.active]="focusMode()"
        [attr.aria-pressed]="focusMode()"
        [attr.aria-label]="focusLabel()"
        [title]="focusLabel()"
        (click)="toggleFocus.emit()"
      >
        {{ t('books.editor.focusLabel') }}
      </button>
    </header>

    <div
      #spreadEl
      class="spread"
      [class.turning-forward]="turning() === 'forward'"
      [class.turning-backward]="turning() === 'backward'"
      [class.is-turning]="turning() !== null"
    >
      <div class="spine" aria-hidden="true"></div>
      <div #pagesEl class="pages book-editor">
        <div class="opener" [class.editable]="editable()">
          @if (roman(); as r) {
            <div class="roman">{{ r }}</div>
          }
          <div class="title-row">
            <input
              #titleEl
              type="text"
              class="title-input"
              [value]="chapter().title"
              [placeholder]="t('books.chapters.placeholderTitle')"
              [attr.aria-label]="t('books.chapters.placeholderTitle')"
              [readOnly]="!editable()"
              (input)="onTitleInput($event)"
            />
            @if (editable()) {
              <button
                type="button"
                class="title-edit"
                [attr.aria-label]="t('books.editor.editTitle')"
                [title]="t('books.editor.editTitle')"
                (click)="focusTitle()"
              >
                <mc-icon name="pencil-simple" />
              </button>
            }
          </div>
          <span class="rule" aria-hidden="true"></span>
        </div>
        <mc-editor
          class="editor"
          [value]="chapter().body"
          [placeholder]="t('books.chapters.placeholderBody')"
          [editable]="editable()"
          [entityId]="chapter().id"
          [entityTitle]="chapter().title"
          (valueChange)="onBodyChange($event)"
        />
      </div>
    </div>

    <footer class="ui-foot" aria-hidden="true">
      <span class="foot-side"></span>
      <span class="folio">
        {{
          t('books.editor.pageCounter', {
            left: visiblePages().left,
            right: visiblePages().right,
            total: visiblePages().total,
          })
        }}
      </span>
      <span class="foot-side kbd-hint">{{ t('books.editor.kbdHint') }}</span>
    </footer>
  </div>

  <button
    type="button"
    class="page-nav next"
    [disabled]="atLast()"
    [attr.aria-label]="t('books.editor.pageTurnNext')"
    [title]="t('books.editor.pageTurnNext') + ' · PgDn'"
    (click)="nextSpread()"
  >
    ›
  </button>
</div>
