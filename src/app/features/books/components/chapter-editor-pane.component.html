<header class="bar">
  <input
    type="text"
    class="title-input"
    [value]="chapter().title"
    [placeholder]="t('books.chapters.placeholderTitle')"
    [attr.aria-label]="t('books.chapters.placeholderTitle')"
    [readOnly]="!editable()"
    (input)="onTitleInput($event)"
  />
  <span class="status" [attr.data-status]="status()">{{ statusLabel() }}</span>
  <button
    type="button"
    class="focus-toggle"
    [class.active]="focusMode()"
    [attr.aria-pressed]="focusMode()"
    [attr.aria-label]="focusLabel()"
    [title]="focusLabel()"
    (click)="toggleFocus.emit()"
  >
    {{ t('books.editor.focusLabel') }}
  </button>
</header>
<div class="reading-area">
  <mc-editor
    class="editor"
    [value]="chapter().body"
    [placeholder]="t('books.chapters.placeholderBody')"
    [editable]="editable()"
    [entityId]="chapter().id"
    [entityTitle]="chapter().title"
    (valueChange)="bodyChange.emit($event)"
  />
</div>
<footer class="footer" aria-hidden="true">
  <span>{{ t('books.editor.footerWords', { n: words() }) }}</span>
  <span class="dot">·</span>
  <span>{{ t('books.editor.footerChars', { n: chars() }) }}</span>
  <span class="dot">·</span>
  <span>{{ readingLabel() }}</span>
</footer>
