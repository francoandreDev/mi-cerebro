<div class="pane">
  <header class="topbar">
    <button type="button" class="back" (click)="onBackToIndex()">
      <mc-icon name="arrow-left" />
      <span>{{ t('goals.backToIndex') }}</span>
    </button>
  </header>
  @if (active(); as goal) {
    @if (lock.showForeign()) {
      <mc-lock-banner
        kind="foreign"
        [title]="t('goals.lock.foreign.title')"
        [message]="t('goals.lock.foreign.message')"
        [readonlyLabel]="t('goals.lock.foreign.readonly')"
        [takeoverLabel]="t('goals.lock.foreign.takeover')"
        (readonly)="lock.acceptReadonly()"
        (takeover)="lock.takeover()"
      />
    } @else if (lock.showEvicted()) {
      <mc-lock-banner
        kind="evicted"
        [title]="t('goals.lock.evicted.title')"
        [message]="t('goals.lock.evicted.message')"
        [dismissLabel]="t('goals.lock.evicted.dismiss')"
        (dismiss)="lock.dismissEvicted()"
      />
    }
    <mc-goal-editor-pane
      [goal]="goal"
      [status]="status()"
      [availableTags]="tags()"
      [editable]="lock.editable()"
      (titleChange)="onTitleChange($event)"
      (bodyChange)="onBodyChange($event)"
      (completedChange)="onCompletedChange($event)"
      (deadlineChange)="onDeadlineChange($event)"
      (removeGoal)="onDelete()"
      (addTag)="onAddTag($event)"
      (removeTag)="onRemoveTag($event)"
      (priorityChange)="onPriorityChange($event)"
      (reminderEnabledChange)="onReminderEnabledChange($event)"
      (stepsChange)="onStepsChange($event)"
    />
  } @else {
    <div class="empty">
      <mc-icon name="target" class="empty-icon mc-anim-float" />
      <p>{{ t('goals.selectOne') }}</p>
    </div>
  }
</div>
