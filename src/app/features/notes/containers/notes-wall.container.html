<section class="wall">
  <header class="wall-head">
    <h1 class="wall-title">
      <mc-icon name="note" class="title-icon" aria-hidden="true" />
      {{ t('notes.title') }}
    </h1>
    <mc-notes-filter-bar
      class="wall-filters"
      [tags]="availableTags()"
      [activeTagIds]="activeTagIds()"
      [query]="query()"
      (toggleTag)="onToggleTag($event)"
      (queryChange)="onQueryChange($event)"
      (clear)="onClearFilters()"
    />
  </header>

  <mc-note-compose [busy]="creating()" (create)="onCreate($event)" />

  <div class="roll" [attr.aria-label]="t('notes.wall.tickerLabel')" role="list">
    @for (note of visible(); track note.id) {
      <mc-note-slip
        role="listitem"
        [note]="note"
        [availableTags]="tags()"
        [untitledLabel]="untitledLabel()"
        (open)="onOpen(note.id, note.title)"
        (remove)="onDelete($event)"
      />
    }
    @if (visible().length > 0) {
      <div class="tail" aria-hidden="true">
        <span class="tail-line">{{ t('notes.wall.tickerEnd') }}</span>
      </div>
    }
  </div>

  @if (empty()) {
    <p class="wall-empty">{{ t('notes.empty') }}</p>
  } @else if (noMatch()) {
    <p class="wall-empty">{{ t('notes.wall.noMatch') }}</p>
  }
</section>
