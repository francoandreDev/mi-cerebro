<svg
  [attr.viewBox]="viewBox()"
  preserveAspectRatio="xMinYMin meet"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  @for (lane of model().lanes; track lane.v.id) {
    <g
      class="lane"
      [class.is-hover]="isLaneHovered(lane.v.id)"
      [class.is-dimmed]="isLaneDimmed(lane.v.id)"
      [class.is-active]="isActive(lane.v)"
      role="button"
      tabindex="0"
      [attr.aria-label]="laneAria(lane.v)"
      (mouseenter)="onLaneEnter(lane.v.id)"
      (mouseleave)="onLaneLeave()"
      (focus)="onLaneEnter(lane.v.id)"
      (blur)="onLaneLeave()"
      (click)="onLaneClick(lane, $event)"
      (keydown)="onLaneKey(lane, $event)"
    >
      @if (lane.parentY !== null) {
        <path
          class="fork-line"
          [attr.d]="forkPath(lane)"
          fill="none"
          [attr.stroke]="lane.v.color"
          stroke-width="2"
          [attr.stroke-dasharray]="lane.dashed ? '4 4' : null"
        />
        <circle
          class="fork-dot"
          [attr.cx]="lane.forkX"
          [attr.cy]="lane.parentY"
          r="3"
          fill="currentColor"
          opacity="0.7"
        />
        @if (lane.forkOidShort) {
          <text
            class="fork-sha"
            [attr.x]="lane.forkX"
            [attr.y]="lane.parentY - 6"
            text-anchor="middle"
          >
            {{ lane.forkOidShort }}
          </text>
        }
      }

      <line
        class="lane-line"
        [attr.x1]="lane.parentY !== null ? lane.forkX + 32 : lane.forkX"
        [attr.y1]="lane.y"
        [attr.x2]="lane.headX"
        [attr.y2]="lane.y"
        [attr.stroke]="lane.v.color"
        stroke-width="2"
        [attr.stroke-dasharray]="lane.dashed ? '4 4' : null"
      />

      <g
        class="head-target"
        role="button"
        tabindex="0"
        [attr.aria-label]="t('variants.graph.head.aria', { name: lane.v.name })"
        (click)="onHeadClick(lane, $event)"
        (keydown)="onHeadKey(lane, $event)"
      >
        <circle
          class="head-dot"
          [attr.cx]="lane.headX"
          [attr.cy]="lane.y"
          r="6"
          [attr.fill]="lane.v.color"
        />
        <text class="head-name" [attr.x]="lane.headX + 12" [attr.y]="lane.y + 4">
          {{ lane.v.name }}
        </text>
        @if (lane.headOidShort) {
          <text class="head-sha" [attr.x]="lane.headX + 12" [attr.y]="lane.y + 18">
            {{ lane.headOidShort }}
          </text>
        }
      </g>

      @if (lane.milestone) {
        <g
          class="milestone-target"
          role="button"
          tabindex="0"
          [attr.aria-label]="t('variants.graph.milestone.aria', { name: lane.milestone.name })"
          (click)="onMilestoneClick(lane, $event)"
          (keydown)="onMilestoneKey(lane, $event)"
        >
          <rect
            class="milestone-chip-bg"
            [attr.x]="lane.headX - 32"
            [attr.y]="lane.y - 24"
            width="64"
            height="16"
            rx="3"
          />
          <text
            class="milestone-name"
            [attr.x]="lane.headX"
            [attr.y]="lane.y - 13"
            text-anchor="middle"
          >
            {{ lane.milestone.name }}
          </text>
        </g>
      }
    </g>
  }
</svg>

@if (menu(); as m) {
  <button
    type="button"
    class="menu-backdrop"
    [attr.aria-label]="t('variants.form.cancel')"
    (click)="closeMenu()"
  ></button>
  @if (menuVariant(); as v) {
    <div
      class="lane-menu"
      role="menu"
      [attr.aria-label]="laneAria(v)"
      [style.left.px]="m.x"
      [style.top.px]="m.y"
    >
      @if (!isActive(v)) {
        <button type="button" role="menuitem" (click)="pickAction('switch')">
          {{ t('variants.action.switch') }}
        </button>
      }
      @if (!v.protected) {
        <button type="button" role="menuitem" (click)="pickAction('rename')">
          {{ t('variants.action.rename') }}
        </button>
        <button type="button" role="menuitem" (click)="pickAction('merge')">
          {{ t('variants.action.merge') }}
        </button>
        <div class="menu-sep"></div>
        <button type="button" role="menuitem" class="danger" (click)="pickAction('delete')">
          {{ t('variants.action.delete') }}
        </button>
      }
    </div>
  }
}
