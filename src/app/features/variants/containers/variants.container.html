<section class="page">
  <header class="page-head">
    <div>
      <h2><mc-icon name="copy" class="title-icon" /> {{ t('variants.page.title') }}</h2>
      <p class="subtitle">{{ t('variants.page.subtitle') }}</p>
    </div>
    <div class="head-actions">
      <div class="search-wrap">
        <mc-icon name="magnifying-glass" class="search-icon" />
        <input
          type="search"
          class="search"
          [ngModel]="query()"
          (ngModelChange)="query.set($event)"
          [placeholder]="t('variants.filters.search.placeholder')"
          [attr.aria-label]="t('variants.filters.search')"
        />
      </div>
      <button
        type="button"
        class="primary icon-only mc-hover-grow"
        data-tutorial="variants-create"
        (click)="openCreate()"
        [disabled]="busy()"
        [attr.aria-label]="t('variants.action.new')"
        [title]="t('variants.action.new')"
      >
        <mc-icon name="plus" />
      </button>
      <button
        type="button"
        class="ghost icon-only mc-hover-grow"
        (click)="refreshActivity()"
        [disabled]="refreshing() || busy()"
        [attr.aria-label]="refreshing() ? t('variants.refreshing') : t('variants.refresh')"
        [title]="refreshing() ? t('variants.refreshing') : t('variants.refresh')"
      >
        <mc-icon name="arrows-clockwise" [class.mc-anim-spin]="refreshing()" />
      </button>
      <div class="legend-anchor">
        <button
          type="button"
          class="ghost icon-only mc-hover-grow"
          (click)="toggleLegend()"
          [attr.aria-label]="t('variants.legend.aria')"
          [attr.aria-expanded]="showLegend()"
          [title]="t('variants.legend.aria')"
        >
          <mc-icon name="info" />
        </button>
        @if (showLegend()) {
          <button
            type="button"
            class="legend-backdrop"
            [attr.aria-label]="t('variants.form.cancel')"
            (click)="closeLegend()"
          ></button>
          <div class="legend-pop" role="dialog" aria-modal="false">
            <span class="chip"
              ><span class="dot pulse"></span>{{ t('variants.legend.active') }}</span
            >
            <span class="chip"
              ><span class="dot dormant"></span>{{ t('variants.legend.dormant') }}</span
            >
            <span class="chip"><span class="ico">◇</span>{{ t('variants.legend.vado') }}</span>
            <span class="chip"><span class="ico">⚑</span>{{ t('variants.legend.milestone') }}</span>
          </div>
        }
      </div>
    </div>
  </header>

  <mc-variants-delta
    class="canvas"
    data-tutorial="variants-canvas"
    [class.has-drawer]="!!selected()"
    [variants]="visibleVariants()"
    [overviews]="overviews()"
    [activeId]="file().activeId"
    [selectedId]="selectedId()"
    [dormantIds]="dormantIds()"
    [query]="query()"
    [justMergedId]="justMergedId()"
    (pick)="onSelect($event)"
  />

  @if (selected()) {
    <mc-variant-drawer
      class="drawer"
      [variant]="selected()"
      [overview]="selectedOverview()"
      [parentName]="selectedParentName()"
      [isActive]="isActive(selected())"
      [isDormant]="isDormantNow(selected())"
      [renaming]="!!selected() && renamingId() === selected()!.id"
      [renameValue]="renameValue()"
      [busy]="busy()"
      [switching]="!!switching()"
      (switchTo)="onSwitch()"
      (merge)="onMerge()"
      (delete_)="requestDelete()"
      (renameStart)="startRename()"
      (renameSubmit)="submitRename()"
      (renameCancel)="cancelRename()"
      (renameValueChange)="renameValue.set($event)"
      (colorChange)="onColorChange($event)"
      (openCommit)="onOpenCommit($event)"
      (selectParent)="onSelect($event)"
    />
  }

  <mc-variants-create-modal
    [visible]="showCreate()"
    [parents]="visibleVariants()"
    [overviews]="overviews()"
    [initialFromId]="file().activeId"
    [busy]="busy()"
    (submitted)="submitCreate($event)"
    (cancelled)="cancelCreate()"
  />

  <mc-confirm-dialog
    [request]="confirm.request()"
    (confirmed)="confirm.accept()"
    (cancelled)="confirm.cancel()"
  />
</section>
