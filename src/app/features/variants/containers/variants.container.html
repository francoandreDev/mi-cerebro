<section class="page">
  <header class="page-head">
    <div>
      <h2><mc-icon name="copy" class="title-icon" /> {{ t('variants.page.title') }}</h2>
      <p class="subtitle">{{ t('variants.page.subtitle') }}</p>
    </div>
    <div class="head-actions">
      <button
        type="button"
        class="ghost mc-hover-grow"
        (click)="refreshActivity()"
        [disabled]="refreshing() || busy()"
      >
        <mc-icon name="arrows-clockwise" [class.mc-anim-spin]="refreshing()" />
        <span>{{ refreshing() ? t('variants.refreshing') : t('variants.refresh') }}</span>
      </button>
    </div>
  </header>

  <div class="split">
    <mc-variants-tree
      class="pane-left"
      [tree]="tree()"
      [activeId]="file().activeId"
      [selectedId]="selectedId()"
      [dormantIds]="dormantIds()"
      [query]="query()"
      [busy]="busy()"
      (pick)="onSelect($event)"
      (queryChange)="query.set($event)"
      (createNew)="openCreate()"
    />

    <mc-variant-detail
      class="pane-right"
      [variant]="selected()"
      [overview]="selectedOverview()"
      [parentName]="selectedParentName()"
      [isActive]="isActive(selected())"
      [isDormant]="isDormantNow(selected())"
      [renaming]="!!selected() && renamingId() === selected()!.id"
      [renameValue]="renameValue()"
      [busy]="busy()"
      [switching]="!!switching()"
      (switchTo)="onSwitch()"
      (merge)="onMerge()"
      (delete_)="requestDelete()"
      (renameStart)="startRename()"
      (renameSubmit)="submitRename()"
      (renameCancel)="cancelRename()"
      (renameValueChange)="renameValue.set($event)"
      (colorChange)="onColorChange($event)"
      (openCommit)="onOpenCommit($event)"
    />
  </div>

  <mc-variants-create-modal
    [visible]="showCreate()"
    [parents]="visibleVariants()"
    [overviews]="overviews()"
    [initialFromId]="file().activeId"
    [busy]="busy()"
    (submitted)="submitCreate($event)"
    (cancelled)="cancelCreate()"
  />

  @if (deleteRequest(); as req) {
    <button
      type="button"
      class="modal-backdrop"
      [attr.aria-label]="t('variants.form.cancel')"
      (click)="cancelDelete()"
    ></button>
    <div class="modal" role="alertdialog" aria-modal="true">
      <h3><mc-icon name="trash" class="title-icon" /> {{ t('variants.action.delete') }}</h3>
      <p>{{ t('variants.delete.confirm', { name: req.variant.name }) }}</p>
      @if (req.unmerged > 0) {
        <p class="warning">
          <mc-icon name="warning" class="mc-anim-pulse" />
          <span>{{ t('variants.delete.unmerged.warning', { n: req.unmerged }) }}</span>
        </p>
      }
      <div class="modal-actions">
        <button
          type="button"
          class="ghost mc-hover-grow"
          (click)="cancelDelete()"
          [disabled]="busy()"
        >
          <mc-icon name="x" />
          <span>{{ t('variants.form.cancel') }}</span>
        </button>
        <button
          type="button"
          class="danger mc-hover-wiggle"
          (click)="confirmDelete()"
          [disabled]="busy()"
        >
          <mc-icon name="trash" />
          <span>{{ t('variants.delete.confirm.button') }}</span>
        </button>
      </div>
    </div>
  }
</section>
