<section class="page">
  <mc-calendar-toolbar
    data-tutorial="calendar-toolbar"
    [allEvents]="allEvents()"
    [selectedDay]="cursor().day"
    (pickResult)="onSearchPick($event)"
    (pickDay)="onPickDayFromToolbar($event)"
    (pickToday)="onToday()"
  />

  <header class="head">
    <div class="nav">
      <button
        type="button"
        class="ghost"
        (click)="onPrev()"
        [attr.aria-label]="t('calendar.nav.prev')"
      >
        <mc-icon name="caret-left" />
      </button>
      @if (view() === 'month') {
        <label class="period-pick">
          <span class="sr">{{ t('calendar.period.month') }}</span>
          <select #ms (change)="onMonthSelect(+ms.value)">
            @for (m of monthOptions; track m.value) {
              <option [value]="m.value" [selected]="m.value === cursor().month">
                {{ m.label }}
              </option>
            }
          </select>
        </label>
      }
      <label class="period-pick">
        <span class="sr">{{ t('calendar.period.year') }}</span>
        <select #ys (change)="onYearSelect(+ys.value)">
          @for (y of yearOptions(); track y) {
            <option [value]="y" [selected]="y === cursor().year">{{ y }}</option>
          }
        </select>
      </label>
      <button
        type="button"
        class="ghost"
        (click)="onNext()"
        [attr.aria-label]="t('calendar.nav.next')"
      >
        <mc-icon name="caret-right" />
      </button>
    </div>
    <div class="views" data-tutorial="calendar-views">
      <button
        type="button"
        class="chip"
        [class.active]="view() === 'month'"
        (click)="setView('month')"
      >
        <mc-icon name="grid-four" />
        {{ t('calendar.view.month') }}
      </button>
      <button
        type="button"
        class="chip"
        [class.active]="view() === 'year'"
        (click)="setView('year')"
      >
        <mc-icon name="squares-four" />
        {{ t('calendar.view.year') }}
      </button>
      <button
        type="button"
        class="chip"
        data-tutorial="calendar-view-week"
        [class.active]="view() === 'week'"
        (click)="setView('week')"
      >
        <mc-icon name="books" />
        {{ t('calendar.view.week') }}
      </button>
    </div>
  </header>

  <div class="wall">
    <div class="grid-col">
      @if (view() === 'month') {
        <mc-calendar-light-table
          data-tutorial="calendar-table"
          [year]="cursor().year"
          [month]="cursor().month"
          [selected]="cursor().day"
          [events]="monthEvents()"
          [kindFilter]="kindFilter()"
          (pick)="onPickDay($event)"
          (toggleKind)="onToggleKind($event)"
          (taskRescheduled)="onTaskRescheduled($event)"
        />
      } @else if (view() === 'week') {
        <mc-calendar-leather-book
          data-tutorial="calendar-book"
          [weekStart]="weekStart()"
          [selected]="cursor().day"
          [events]="weekEvents()"
          (pick)="onPickBookDay($event)"
          (prevWeek)="onPrevWeek()"
          (nextWeek)="onNextWeek()"
          (dismiss)="onCloseBook()"
          (openEvent)="onOpenEvent($event)"
          (createTask)="onCreateTask()"
          (createGoal)="onCreateGoal()"
          (createReminder)="onCreateReminder()"
          (createNote)="onCreateNote()"
        />
      } @else {
        <mc-calendar-year-grid
          [year]="cursor().year"
          [events]="yearEvents()"
          (pick)="onPickYearMonth($event)"
          (openMonth)="onOpenMonth($event)"
        />
      }
    </div>

    <aside class="cards-col" data-tutorial="calendar-wallboard" aria-label="Wallboard">
      @if (tags().length > 0) {
        <mc-calendar-tag-filter
          [tags]="tags()"
          [selected]="tagFilter()"
          (toggleTag)="onToggleTag($event)"
          (clearTags)="onClearTags()"
        />
      }
      @for (group of wallGroups(); track group.kind) {
        <mc-calendar-kind-card
          [kind]="group.kind"
          [events]="group.events"
          [active]="kindFilter().has(group.kind)"
          (toggleActive)="onToggleKind(group.kind)"
          (openEvent)="onOpenEvent($event)"
          (create)="onCreateForKind(group.kind)"
        />
      } @empty {
        <div class="wallboard-empty">
          <p>{{ t('calendar.wallboard.empty') }}</p>
          <button type="button" class="clear mc-hover-wiggle" (click)="onResetWallFilters()">
            <mc-icon name="x" />
            <span>{{ t('calendar.wallboard.clearFilter') }}</span>
          </button>
        </div>
      }
    </aside>
  </div>

  @if (modalOpen() && cursor().day; as day) {
    <mc-calendar-day-modal
      [date]="day"
      [events]="dayEvents()"
      (dismiss)="onCloseDay()"
      (openEvent)="onOpenEvent($event)"
      (createTask)="onCreateTask()"
      (createGoal)="onCreateGoal()"
      (createReminder)="onCreateReminder()"
      (openBook)="onOpenBook($event)"
    />
  }
</section>
