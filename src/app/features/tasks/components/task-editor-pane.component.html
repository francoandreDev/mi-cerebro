@if (!focusMode.active()) {
  <header class="bar">
    <label class="done">
      <input
        type="checkbox"
        [checked]="task().done"
        [disabled]="!editable()"
        (change)="onDoneToggle($event)"
      />
      <span class="sr-only">{{ t('tasks.done.label') }}</span>
    </label>
    <input
      type="text"
      class="title-input"
      [class.done]="task().done"
      [value]="task().title"
      [placeholder]="t('tasks.placeholderTitle')"
      [attr.aria-label]="t('tasks.placeholderTitle')"
      [readOnly]="!editable()"
      (input)="onTitleInput($event)"
    />
    <span class="status" [attr.data-status]="status()">
      <mc-icon
        [name]="statusIcon()"
        [class.mc-anim-spin]="status() === 'saving'"
        [class.mc-anim-pulse]="status() === 'unsaved'"
      />
      {{ statusLabel() }}
    </span>
    @if (editable()) {
      <button
        type="button"
        class="danger mc-hover-wiggle"
        data-tutorial="tasks-editor-delete"
        (click)="removeTask.emit()"
      >
        <mc-icon name="trash" />
        <span>{{ t('tasks.delete') }}</span>
      </button>
    }
  </header>
  <section class="meta">
    <mc-icon name="calendar-dots" class="meta-icon" />
    <span class="label">{{ t('tasks.due.label') }}:</span>
    <mc-due-dates-picker
      [dates]="task().dueDates"
      [editable]="editable()"
      (add)="addDueDate.emit($event)"
      (remove)="removeDueDate.emit($event)"
    />
  </section>
  <section class="meta reminder" data-tutorial="tasks-editor-reminder">
    <mc-icon name="bell" class="meta-icon" />
    <label class="reminder-toggle">
      <input
        type="checkbox"
        [checked]="task().reminder.enabled"
        [disabled]="!editable() || task().done || task().dueDates.length === 0"
        (change)="onReminderToggle($event)"
      />
      <span>{{ t('tasks.reminder.toggleLabel') }}</span>
    </label>
    @if (task().dueDates.length === 0) {
      <span class="reminder-hint">{{ t('tasks.reminder.requiresDueDate') }}</span>
    } @else if (task().reminder.enabled) {
      <span class="reminder-hint">{{ t('tasks.reminder.toggleHint') }}</span>
    }
  </section>
  <mc-tag-picker
    data-tutorial="tasks-editor-tags"
    [availableTags]="availableTags()"
    [selectedIds]="task().tags"
    [editable]="editable()"
    (addTag)="addTag.emit($event)"
    (removeTag)="removeTag.emit($event)"
  />
}
<mc-editor
  class="editor"
  [value]="task().body"
  [placeholder]="t('tasks.placeholderBody')"
  [editable]="editable()"
  [entityId]="task().id"
  [entityTitle]="task().title"
  (valueChange)="bodyChange.emit($event)"
/>
