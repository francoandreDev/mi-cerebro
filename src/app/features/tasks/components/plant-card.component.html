@let s = entry().summary;
<article
  class="card"
  [class.card--seed]="stage() === 'seed'"
  [class.card--sprout]="stage() === 'sprout'"
  [class.card--bloom]="stage() === 'bloom'"
  [class.card--wilting]="wilting()"
  [class.card--done]="s.done"
  [class.card--lifted]="lifted()"
  [class.card--plop]="justSprouted()"
  [class.card--watered]="watered()"
  [class.card--emerging]="emerging()"
  [attr.aria-label]="ariaLabel()"
  [attr.data-task-id]="s.id"
  tabindex="0"
  draggable="true"
  (click)="onClick()"
  (keydown)="onTransplantKey($event)"
>
  <div class="glyph" [style.color]="petalColor()" [innerHTML]="glyph()"></div>
  <div class="label">
    <span class="title">{{ displayTitle() }}</span>
    @if (primaryTag(); as tag) {
      <span class="tag" [style.color]="tag.color">#{{ tag.label }}</span>
    }
  </div>
  @if (canWater()) {
    <button
      type="button"
      class="water-btn"
      [attr.aria-label]="waterAriaLabel()"
      (click)="onWaterClick($event)"
    >
      💧
    </button>
  }
  @if (transplantMenuOpen()) {
    <div class="transplant-menu" role="menu" [attr.aria-label]="t('tasks.garden.transplantPrompt')">
      @for (opt of transplantOptions(); track opt.label) {
        <button
          type="button"
          class="menu-item"
          role="menuitem"
          (click)="onTransplantOption(opt); $event.stopPropagation()"
        >
          {{ opt.label }}
        </button>
      }
    </div>
  }
</article>
