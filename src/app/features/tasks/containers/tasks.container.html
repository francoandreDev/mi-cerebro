<mc-confirm-dialog
  [request]="confirm.request()"
  (confirmed)="confirm.accept()"
  (cancelled)="confirm.cancel()"
/>
<div class="pane">
  <header class="topbar">
    <button type="button" class="back" (click)="onBackToIndex()">
      <mc-icon name="arrow-left" />
      <span>{{ t('tasks.backToIndex') }}</span>
    </button>
  </header>
  @if (active(); as task) {
    @if (lock.showForeign()) {
      <mc-lock-banner
        kind="foreign"
        [title]="t('tasks.lock.foreign.title')"
        [message]="t('tasks.lock.foreign.message')"
        [readonlyLabel]="t('tasks.lock.foreign.readonly')"
        [takeoverLabel]="t('tasks.lock.foreign.takeover')"
        (readonly)="lock.acceptReadonly()"
        (takeover)="lock.takeover()"
      />
    } @else if (lock.showEvicted()) {
      <mc-lock-banner
        kind="evicted"
        [title]="t('tasks.lock.evicted.title')"
        [message]="t('tasks.lock.evicted.message')"
        [dismissLabel]="t('tasks.lock.evicted.dismiss')"
        (dismiss)="lock.dismissEvicted()"
      />
    }
    <mc-task-editor-pane
      [task]="task"
      [status]="status()"
      [availableTags]="tags()"
      [editable]="lock.editable()"
      (titleChange)="onTitleChange($event)"
      (bodyChange)="onBodyChange($event)"
      (doneChange)="onDoneChange($event)"
      (addDueDate)="onAddDueDate($event)"
      (removeDueDate)="onRemoveDueDate($event)"
      (reminderEnabledChange)="onReminderEnabledChange($event)"
      (removeTask)="onDelete()"
      (addTag)="onAddTag($event)"
      (removeTag)="onRemoveTag($event)"
    />
  } @else {
    <div class="empty">
      <mc-icon name="check-square" class="empty-icon mc-anim-float" />
      <p>{{ t('tasks.selectOne') }}</p>
    </div>
  }
</div>
